[xdebug]
; Xdebug полностью отключен для производительности.
; При необходимости отладки раскомментируйте строки ниже
; и пересоберите контейнер.

xdebug.mode=off

; zend_extension=xdebug
; xdebug.mode=debug
; xdebug.client_host=host.docker.internal
; xdebug.client_port=9003
; xdebug.start_with_request=yes
; xdebug.idekey=doska

; Минимальное логирование на случай если включим
; xdebug.log=/var/www/html/xdebug.log
; xdebug.log_level=0

; Performance profiling (отключено)
; xdebug.profiler_enable=0
; xdebug.profiler_enable_trigger=1
; xdebug.profiler_output_dir=/var/www/html/profiler
